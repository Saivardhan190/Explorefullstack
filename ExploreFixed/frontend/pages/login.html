<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Explore Travel</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <!-- Header -->
  <header class="header" id="header">
    <div class="container">
      <nav class="navbar">
        <a href="../index.html" class="logo">Explore</a>
        <ul class="nav-links">
          <li><a href="../index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="packages.html">Packages</a></li>
          <li><a href="gallery.html">Gallery</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li><a href="login.html" class="btn btn-outline active">Login</a></li>
        </ul>
        <div class="hamburger">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </nav>
    </div>
  </header>

  <!-- Login Section -->
  <section class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Welcome Back</h2>
        <p>Sign in to access your account</p>
      </div>
      <div class="auth-form">
        <form id="login-form">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" class="form-control" required>
          </div>
          <div id="error-message" class="alert alert-danger" style="display: none;"></div>
          <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
            <div>
              <input type="checkbox" id="remember" class="form-check-input">
              <label for="remember" class="form-check-label">Remember me</label>
            </div>
            <a href="#" class="forgot-password">Forgot Password?</a>
          </div>
          <button type="submit" id="login-btn" class="btn btn-primary btn-block">Login</button>
        </form>

        <div class="auth-social">
          <a href="#" class="social-btn facebook"><i class="fab fa-facebook-f"></i></a>
          <a href="#" class="social-btn google"><i class="fab fa-google"></i></a>
          <a href="#" class="social-btn twitter"><i class="fab fa-twitter"></i></a>
        </div>
      </div>
      <div class="auth-footer">
        <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-content">
        <!-- Footer details here... unchanged -->
      </div>
      <div class="footer-bottom">
        <p>&copy; 2025 Explore Travel. All Rights Reserved.</p>
      </div>
    </div>
  </footer>

  <script src="../js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
        // Scroll header effect
        const header = document.getElementById('header');
        window.addEventListener('scroll', function () {
            header.classList.toggle('scrolled', window.scrollY > 50);
        });

        // Mobile nav
        const hamburger = document.querySelector('.hamburger');
        const navLinks = document.querySelector('.nav-links');
        hamburger.addEventListener('click', function () {
            navLinks.classList.toggle('active');
            hamburger.classList.toggle('active');
        });

        // Check if user is already logged in (redirect if true)
        if (typeof(Storage) !== "undefined") {
            const token = localStorage.getItem('token');
            const user = localStorage.getItem('user');
            
            if (token && user) {
                try {
                    const userData = JSON.parse(user);
                    if (userData && userData.name) {
                        window.location.href = '../index.html';
                        return;
                    }
                } catch (e) {
                    // Invalid user data, clear it
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                }
            }
        }

        // Login logic
        const loginForm = document.getElementById('login-form');
        const errorMessage = document.getElementById('error-message');

        if (loginForm) {
            loginForm.addEventListener('submit', async function (e) {
                e.preventDefault();

                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const loginBtn = document.getElementById('login-btn');

                // Basic validation
                if (!email || !password) {
                    errorMessage.textContent = 'Please fill in all fields';
                    errorMessage.style.display = 'block';
                    return;
                }

                // Email validation
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(email)) {
                    errorMessage.textContent = 'Please enter a valid email address';
                    errorMessage.style.display = 'block';
                    return;
                }

                errorMessage.style.display = 'none';
                loginBtn.textContent = 'Logging in...';
                loginBtn.disabled = true;

                try {
                    // Check if exploreAPI exists
                    if (typeof window.exploreAPI === 'undefined') {
                        throw new Error('API not available. Please ensure api.js is loaded correctly.');
                    }

                    const response = await window.exploreAPI.login(email, password);
                    console.log('Login response:', response);

                  if (response && response.success && response.token) {
                      // Store whatever user data exists
                      const userData = response.user || response.data || {};
                      localStorage.setItem('user', JSON.stringify(userData));
                      localStorage.setItem('token', response.token);
                      window.location.href = '../index.html';
                  } else {
                      throw new Error(response.message || 'Login failed');
                  }
                } catch (error) {
                    console.error('Login error:', error);
                    errorMessage.textContent = error.message || 'Login failed. Please try again.';
                    errorMessage.style.display = 'block';
                } finally {
                    loginBtn.textContent = 'Login';
                    loginBtn.disabled = false;
                }
            });
        }

        // Animation
        const authCard = document.querySelector('.auth-card');
        if (authCard) {
            setTimeout(() => {
                authCard.classList.add('fade-in');
            }, 100);
        }
    });
  </script>

  <style>
    .auth-card {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .auth-card.fade-in {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</body>
</html>
